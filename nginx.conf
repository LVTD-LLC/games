map $uri $games_cache_control {
  default "no-cache";
  /deploy-revision.txt "no-store";
  ~*/(?:assets|_astro)/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Cache-Control $games_cache_control always;
  location / {
    try_files $uri $uri/ =404;
  }
  location ~* /(?:assets|_astro)/.*\.[a-z0-9]+$ {
    try_files $uri =404;
  }
  error_page 404 /404.html;
}
