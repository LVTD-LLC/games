map $uri $games_cache_control {
  default "no-cache";
  /deploy-revision.txt "no-store";
  ~*/(?:assets|_astro)/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Cache-Control $games_cache_control always;
  # The game backend is independent of the catalogue and static game packages.
  # Docker DNS is resolved at request time so API redeploys never leave a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location ~ ^/(api/corporate-bs(?:/|$)|corporate-bs-meter/(?:result|unsubscribe)/) {
    set $bs_backend http://srv-captain--corporate-bs-api:80;
    proxy_pass $bs_backend$request_uri;
    proxy_set_header Host $host;
    # CapRover appends the actual client IP. Do not append this inner proxy hop.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    proxy_connect_timeout 5s;
    client_max_body_size 4k;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  location ~* /(?:assets|_astro)/.*\.[a-z0-9]+$ {
    try_files $uri =404;
  }
  error_page 404 /404.html;
}
