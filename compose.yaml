# Local development only. Production is a private CapRover games-postgres app.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: games
      POSTGRES_PASSWORD: local-games-only
      POSTGRES_DB: games
    ports: ['127.0.0.1:5432:5432']
    volumes: ['games-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U games -d games']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  games-postgres:
