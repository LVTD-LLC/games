name: Deploy to CapRover
run-name: Deploy main · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: caprover-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      CAPROVER_SERVER: https://captain.cap.gregagi.com
      CAPROVER_APP_NAME: games
      PRODUCTION_URL: https://games.cap.gregagi.com
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip superseded commits
        id: current
        timeout-minutes: 1
        env:
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          latest_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest_sha" = "$DEPLOY_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer main commit exists; this deployment is skipped."
          fi

      - name: Set up Node
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Package tracked source and revision marker
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          staging_dir="$RUNNER_TEMP/caprover-source"
          mkdir -p "$staging_dir"
          git archive "$DEPLOY_SHA" | tar -x -C "$staging_dir"
          printf '%s\n' "$DEPLOY_SHA" > "$staging_dir/apps/site/public/deploy-revision.txt"
          tar -cf "$RUNNER_TEMP/deploy.tar" -C "$staging_dir" .

      - name: Package scoring API and revision marker
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          api_staging_dir="$RUNNER_TEMP/corporate-bs-source"
          mkdir -p "$api_staging_dir"
          git archive "$DEPLOY_SHA" | tar -x -C "$api_staging_dir"
          cp "$api_staging_dir/services/corporate-bs-api/captain-definition" "$api_staging_dir/captain-definition"
          printf '%s\n' "$DEPLOY_SHA" > "$api_staging_dir/services/corporate-bs-api/revision.txt"
          tar -cf "$RUNNER_TEMP/corporate-bs-api.tar" -C "$api_staging_dir" .

      - name: Deploy and verify scoring API before the game frontend
        if: steps.current.outputs.deploy == 'true'
        env:
          CAPROVER_APP_NAME: corporate-bs-api
          CAPROVER_APP_TOKEN: ${{ secrets.CORPORATE_BS_CAPROVER_APP_TOKEN }}
          PRODUCTION_URL: https://corporate-bs-api.cap.gregagi.com
        run: node scripts/deploy-caprover.mjs "$RUNNER_TEMP/corporate-bs-api.tar" "$DEPLOY_SHA"

      - name: Deploy and wait for the tested revision to be live
        if: steps.current.outputs.deploy == 'true'
        env:
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: node scripts/deploy-caprover.mjs "$RUNNER_TEMP/deploy.tar" "$DEPLOY_SHA"

      - name: Publish deployment summary
        if: steps.current.outputs.deploy == 'true'
        env:
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          {
            echo "## CapRover deployment verified"
            echo "Commit: $DEPLOY_SHA"
            echo "CI run: $CI_RUN_URL"
            echo "Production: $PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
